name: Release

on:
  push:
    tags:
      - "v*"

# Permissions required for:
#   contents: write   — create GitHub Release and upload assets
#   id-token: write   — obtain OIDC token for GitHub Artifact Attestations
#   attestations: write — publish build provenance attestations
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests before release
        run: go test ./... -count=1

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/dns-doctor_*_linux_amd64.tar.gz
            dist/dns-doctor_*_linux_arm64.tar.gz
            dist/dns-doctor_*_darwin_amd64.tar.gz
            dist/dns-doctor_*_darwin_arm64.tar.gz
            dist/dns-doctor_*_windows_amd64.zip
            dist/checksums.txt
